<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>خارج الصندوق | نادي الابتكار وريادة الأعمال</title>
  <meta name="description" content="أربع مراحل، أسئلة غير متوقعة، ونقاط تحدد مكانك بين المتسابقين — هل تستطيع التفكير بطريقة مختلفة؟">
  <meta name="theme-color" content="#070B18">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=2.0.0">
  <link rel="stylesheet" href="css/screens.css?v=2.0.0">
</head>
<body>

  <!-- خلفية -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="bg-orb o1"></div>
    <div class="bg-orb o2"></div>
    <div class="bg-orb o3"></div>
  </div>

  <canvas class="confetti-canvas" id="confettiCanvas" aria-hidden="true"></canvas>

  <div class="app-root">

    <!-- ══════════ شاشة البداية ══════════ -->
    <section id="landingScreen" class="screen active" aria-labelledby="landingTitle">
      <div class="landing">
        <img class="landing-logo" src="assets/club-logo.svg" alt="شعار نادي الابتكار وريادة الأعمال" width="108" height="108">
        <div class="l-badge reveal"><span class="dot"></span> نادي الابتكار وريادة الأعمال</div>
        <h1 class="l-title reveal reveal-1" id="landingTitle">خارج الصندوق</h1>
        <p class="l-sub reveal reveal-1">هل تستطيع التفكير بطريقة مختلفة؟</p>
        <p class="l-desc reveal reveal-2">4 مراحل، أسئلة غير متوقعة، ونقاط تحدد مكانك بين المتسابقين.</p>

        <form class="l-form reveal reveal-2" id="nameForm" novalidate>
          <label for="playerName">اكتب اسمك</label>
          <input class="field" id="playerName" name="playerName" type="text"
                 autocomplete="off" spellcheck="false"
                 maxlength="40"
                 placeholder="اسمك هنا…" aria-describedby="nameError">
          <p class="error-msg" id="nameError" aria-live="polite"></p>
          <div class="l-actions">
            <button type="submit" class="btn" id="startBtn">
              <span>ابدأ التحدي 🚀</span>
            </button>
          </div>
        </form>

        <div class="l-hint-features reveal reveal-3" aria-hidden="true">
          <span class="pill">⚡ 4 مراحل</span>
          <span class="pill">⏱️ مؤقت</span>
          <span class="pill">🏆 لوحة متصدرين</span>
        </div>

        <footer class="l-footer reveal reveal-3">
          <span>إعداد: جود العرجاني</span>
        </footer>
      </div>
    </section>

    <!-- ══════════ شاشة اللعب ══════════ -->
    <section id="gameScreen" class="screen" role="main" aria-live="polite">
      <div id="gameRoot"></div>
    </section>

    <!-- ══════════ شاشة النتيجة ══════════ -->
    <section id="resultScreen" class="screen" role="main">
      <div id="resultRoot"></div>
    </section>

    <!-- ══════════ لوحة المتصدرين ══════════ -->
    <div id="leaderboardModal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="lbTitle">
      <div class="modal-sheet">
        <button class="modal-close" id="lbCloseBtn" aria-label="إغلاق">✕</button>
        <div class="modal-head">
          <h2 id="lbTitle">🏆 لوحة المتصدرين</h2>
          <p class="sub" id="lbSub"></p>
        </div>
        <div class="modal-body" id="lbBody"></div>
      </div>
    </div>

  </div>

  <script type="module" src="js/app.js?v=2.0.0"></script>
</body>
</html>
